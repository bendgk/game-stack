[package]
name = "vx-core"
description = "voxelscape core: hash-consed sparse 64-tree voxel DAG, composition, queries"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
glam = { version = "0.34.1", features = ["bytemuck"] }
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
rayon = { version = "1.12", optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { workspace = true }

[features]
default = ["parallel"]
# Multi-threaded world builds (native). Off for wasm32 builds.
parallel = ["dep:rayon"]
