[package]
name = "gs-server"
description = "The authoritative game server: WebRTC (str0m) + room actors + Dragonfly + Postgres"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
default-run = "gs-server"

[dependencies]
gs-core.workspace = true
gs-wire.workspace = true
gs-physics.workspace = true
game.workspace = true
serde.workspace = true
serde_json.workspace = true

tokio = { version = "1.54", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
# Sans-IO WebRTC: we own the single UDP socket and the clock; every browser is one Rtc.
# rust-crypto = pure-Rust DTLS/SRTP, so the Docker build needs no C toolchain.
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
# Dragonfly speaks the Redis protocol.
fred = { version = "10.1", default-features = false, features = ["i-std", "i-streams", "i-keys"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
bytes = "1"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
