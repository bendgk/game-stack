[package]
name = "vx-terrain"
description = "voxelscape terrain: fast noise primitives, heightmaps, hydraulic + thermal erosion (CPU and GPU), voxel terrain shapes (eroded landscapes, Minecraft-style blocks)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
vx-core = { path = "../vx-core", default-features = false }
rayon = { version = "1.12", optional = true }
wgpu = { version = "30", optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = { version = "1", optional = true }

[features]
default = ["parallel", "gpu"]
parallel = ["dep:rayon", "vx-core/parallel"]
# GPU erosion via wgpu (Metal / Vulkan / DX12 natively, WebGPU in the browser).
gpu = ["dep:wgpu", "dep:pollster"]
