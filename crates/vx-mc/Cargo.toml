[package]
name = "vx-mc"
description = "voxelscape ⇄ Minecraft: read Anvil worlds and resource packs, voxelize blocks with their textures (32 voxels per block), build a voxelscape world"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
vx-core = { path = "../vx-core" }
vx-gen = { path = "../vx-gen" }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
png = "0.18"
rayon = "1.12"
